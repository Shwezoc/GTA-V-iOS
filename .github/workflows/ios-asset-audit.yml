name: iOS GTA V asset compatibility audit

on:
  push:
    branches: [minimal-runtime]
    paths:
      - ".github/workflows/ios-asset-audit.yml"
      - "tools/audit_ios_assets.py"
      - "docs/LIGHTWEIGHT_PORT_SCOPE.md"
  workflow_dispatch:
    inputs:
      franklin_run_id:
        description: GitHub Actions run ID containing the Franklin/Niko asset artifact
        required: true
        default: "46113312010"
        type: string
      bmw_run_id:
        description: GitHub Actions run ID containing the BMW M5 F90 GLB artifact
        required: true
        default: "46112567911"
        type: string
      bmw_native_run_id:
        description: GitHub Actions run ID containing the native BMW RAGE resources
        required: true
        default: "46094904611"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  audit-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Franklin native resources and retargeted animations
        uses: actions/download-artifact@v4
        with:
          name: franklin-niko-retargeted-animated-glb
          run-id: ${{ inputs.franklin_run_id || '46113312010' }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: work/assets/franklin

      - name: Download BMW M5 F90 GLB and previews
        uses: actions/download-artifact@v4
        with:
          name: BMW-M5-F90-GLB-and-previews
          run-id: ${{ inputs.bmw_run_id || '46112567911' }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: work/assets/bmw

      - name: Download original-format BMW RAGE resources and vehicle metadata
        uses: actions/download-artifact@v4
        with:
          name: BMW-M5-F90-extracted-RAGE-assets
          run-id: ${{ inputs.bmw_native_run_id || '46094904611' }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: work/assets/bmw-native

      - name: Validate RSC7 resources, GLB skinning, animations and textures
        run: |
          set -euo pipefail
          python3 tools/audit_ios_assets.py \
            --franklin-dir work/assets/franklin \
            --bmw-dir work/assets/bmw \
            --bmw-native-dir work/assets/bmw-native \
            --output work/ios-asset-audit.json

      - name: Upload asset compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: ios-gta-v-asset-compatibility-report
          path: work/ios-asset-audit.json
          if-no-files-found: error
          retention-days: 30
