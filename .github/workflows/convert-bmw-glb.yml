name: Convert BMW M5 F90 to GLB

on:
  push:
    branches: [minimal-runtime]
    paths:
      - "tools/bmw-yft-to-glb/**"
      - ".github/workflows/convert-bmw-glb.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout minimal-runtime
        uses: actions/checkout@v4
        with:
          ref: minimal-runtime

      - name: Download extracted RAGE resources
        uses: actions/download-artifact@v4
        with:
          name: BMW-M5-F90-extracted-RAGE-assets
          run-id: 46094904611
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: source

      - name: Convert GTA V YFT and YTD to binary glTF
        run: |
          set -euo pipefail
          cargo run --release --manifest-path tools/bmw-yft-to-glb/Cargo.toml -- source/bmw-assets out/bmw-m5-f90
          test -s out/bmw-m5-f90/bmwm5f90.glb
          test -s out/bmw-m5-f90/bmwm5f90_hi.glb
          ls -lh out/bmw-m5-f90

      - name: Bundle local Three.js viewer dependencies
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bmw-viewer-deps --no-save three@0.180.0
          mkdir -p browser/vendor/examples/jsm/loaders browser/vendor/examples/jsm/utils
          cp /tmp/bmw-viewer-deps/node_modules/three/build/three.module.js browser/vendor/three.module.js
          cp /tmp/bmw-viewer-deps/node_modules/three/build/three.core.js browser/vendor/three.core.js
          cp /tmp/bmw-viewer-deps/node_modules/three/examples/jsm/loaders/GLTFLoader.js browser/vendor/examples/jsm/loaders/GLTFLoader.js
          cp /tmp/bmw-viewer-deps/node_modules/three/examples/jsm/utils/BufferGeometryUtils.js browser/vendor/examples/jsm/utils/BufferGeometryUtils.js
          mkdir -p browser/assets/models/bmw-m5-f90
          cp out/bmw-m5-f90/bmwm5f90_hi.glb browser/assets/models/bmw-m5-f90/bmwm5f90_hi.glb
          cp out/bmw-m5-f90/bmwm5f90_hi-preview.png browser/assets/models/bmw-m5-f90/bmwm5f90_hi-preview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/vendor browser/assets/models/bmw-m5-f90
          if git diff --cached --quiet; then
            echo "Viewer assets are already up to date."
          else
            git commit -m "Add converted BMW M5 F90 model to browser asset viewer"
            git push origin HEAD:minimal-runtime
          fi

      - name: Publish converted model and previews
        uses: actions/upload-artifact@v4
        with:
          name: BMW-M5-F90-GLB-and-previews
          path: out/bmw-m5-f90/
          if-no-files-found: error
          retention-days: 30
