name: iOS IPA Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify upstream source checkout
        run: |
          set -e
          git submodule status --recursive
          test -f upstream/gtav-recomp/README.md
      - name: Build iOS app
        run: |
          xcodebuild -project ios/ShwezovGTAV.xcodeproj -scheme ShwezovGTAV -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Game.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Package IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/Game.xcarchive/Products/Applications/ShwezovGTAV.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ShwezovGTAV.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShwezovGTAV-IPA
          path: ShwezovGTAV.ipa
