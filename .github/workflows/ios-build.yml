name: iOS Diagnostic Shell Build (not GTA V runtime)
on:
  push:
    branches: [main, minimal-runtime]
    paths:
      - "ios/**"
      - "upstream/gtav-recomp"
      - "tools/verify_upstream_ios.sh"
      - "tools/prepare_upstream_ios_deps.sh"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Audit upstream iOS source and build inputs
        run: |
          set -e
          git submodule status --recursive
          sh tools/verify_upstream_ios.sh
      - name: Build diagnostic Swift/Metal shell
        run: |
          xcodebuild -project ios/ShwezovGTAV.xcodeproj -scheme ShwezovGTAV -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Game.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Package diagnostic shell IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/Game.xcarchive/Products/Applications/ShwezovGTAV.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ShwezovGTAV-DIAGNOSTIC-SHELL-NOT-GAME.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShwezovGTAV-DIAGNOSTIC-SHELL-NOT-GAME
          path: ShwezovGTAV-DIAGNOSTIC-SHELL-NOT-GAME.ipa
