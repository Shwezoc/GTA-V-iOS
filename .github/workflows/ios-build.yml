name: iOS IPA Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS Archive
        run: |
          xcodebuild \
            -project ios/ShwezovGTAV.xcodeproj \
            -scheme ShwezovGTAV \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ShwezovGTAV.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ShwezovGTAV.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ShwezovGTAV.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShwezovGTAV-IPA
          path: build/ShwezovGTAV.ipa
