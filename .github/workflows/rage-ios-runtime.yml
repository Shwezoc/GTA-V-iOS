name: RAGE iOS Runtime Shell (no game data)

on:
  workflow_dispatch:
  push:
    branches: [minimal-runtime]
    paths:
      - "upstream/gtav-recomp"
      - "tools/prepare_upstream_ios_deps.sh"
      - "patches/*.patch"
      - ".github/workflows/rage-ios-runtime.yml"

concurrency:
  group: rage-ios-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-ios-runtime:
    name: Build iOS runtime (${{ matrix.cpu_target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        cpu_target: [apple-a14, apple-a13]
    timeout-minutes: 120
    steps:
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja

      - name: Prepare pinned third-party sources and upstream patches
        run: sh tools/prepare_upstream_ios_deps.sh

      - name: Validate local-only game library build helper
        run: |
          set -euo pipefail
          bash -n tools/build_local_ios_game_dylib.sh
          test -f upstream/gtav-recomp/tools/game_dll/build_game_dll.py
          test -f upstream/gtav-recomp/tools/game_dll/libSystem_ios.tbd
          grep -q -- '--ios' tools/build_local_ios_game_dylib.sh
          grep -q 'No game data or generated source will be uploaded' tools/build_local_ios_game_dylib.sh

      - name: Build macOS host SDK (provides rexglue code generator)
        working-directory: upstream/gtav-recomp/rexglue-sdk
        run: |
          cmake -S . -B out/build/mac-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="$PWD/out/install/mac-arm64" \
            -DREXGLUE_ENABLE_TRACY=OFF
          cmake --build out/build/mac-arm64 --parallel 3
          cmake --install out/build/mac-arm64

      - name: Build iOS ReXGlue runtime SDK
        working-directory: upstream/gtav-recomp/rexglue-sdk
        run: |
          cmake -S . -B out/build/ios-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS=-mcpu=${{ matrix.cpu_target }} \
            -DCMAKE_CXX_FLAGS=-mcpu=${{ matrix.cpu_target }} \
            -DCMAKE_CXX_STANDARD=23 \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/out/install/ios-arm64"
          cmake --build out/build/ios-arm64 --parallel 3
          cmake --install out/build/ios-arm64

      - name: Build upstream MoltenVK for iOS
        run: |
          set -euo pipefail
          MVK_ROOT="$RUNNER_TEMP/MoltenVK"
          git clone --depth 1 --branch v1.4.2 https://github.com/KhronosGroup/MoltenVK.git "$MVK_ROOT"
          cd "$MVK_ROOT"
          ./fetchDependencies --ios
          make ios
          MVK_BIN="$(find Package -type f -path '*/ios-arm64/MoltenVK.framework/MoltenVK' -print -quit)"
          test -n "$MVK_BIN" || { echo "ERROR: iOS MoltenVK framework binary not found"; find Package -maxdepth 8 -type f -print; exit 1; }
          mkdir -p "$RUNNER_TEMP/moltenvk-output"
          cp "$MVK_BIN" "$RUNNER_TEMP/moltenvk-output/libMoltenVK.dylib"
          echo "MOLTENVK_BINARY=$RUNNER_TEMP/moltenvk-output/libMoltenVK.dylib" >> "$GITHUB_ENV"
          file "$RUNNER_TEMP/moltenvk-output/libMoltenVK.dylib"
          lipo -archs "$RUNNER_TEMP/moltenvk-output/libMoltenVK.dylib" | grep -qw arm64
          cp LICENSE "$RUNNER_TEMP/moltenvk-output/MOLTENVK-LICENSE.txt"

      - name: Configure upstream GTA V iOS shell
        working-directory: upstream/gtav-recomp/gtav
        run: |
          cmake -S . -B ../build/ios-shell -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS=-mcpu=${{ matrix.cpu_target }} \
            -DCMAKE_CXX_FLAGS=-mcpu=${{ matrix.cpu_target }} \
            -DCMAKE_PREFIX_PATH="$PWD/../rexglue-sdk/out/install/ios-arm64" \
            -DCMAKE_FIND_ROOT_PATH="$PWD/../rexglue-sdk/out/install/ios-arm64" \
            -DGTAV_GAME_DLL=ON \
            -DGTAV_HOST_REXGLUE="$PWD/../rexglue-sdk/out/install/mac-arm64/bin/rexglue" \
            -DGTAV_PREBUILT_NATIVE_SHADERS=

      - name: Compile upstream GTA V iOS shell
        working-directory: upstream/gtav-recomp
        run: cmake --build build/ios-shell --parallel 3

      - name: Assemble upstream GTAV.app shell and local-build interface
        run: |
          set -euo pipefail
          UPSTREAM="$GITHUB_WORKSPACE/upstream/gtav-recomp"
          MVK_FRAMEWORK="$RUNNER_TEMP/moltenvk-framework"
          test -f "$MOLTENVK_BINARY" || { echo "ERROR: MoltenVK iOS binary is missing"; exit 1; }
          mkdir -p "$MVK_FRAMEWORK"
          cp "$MOLTENVK_BINARY" "$MVK_FRAMEWORK/MoltenVK"
          test -f "$UPSTREAM/rexglue-sdk/thirdparty/moltenvk/LICENSE"
          MOLTENVK_FW="$MVK_FRAMEWORK" \
          GTAV_SHELL="$UPSTREAM/build/ios-shell/gtav_fast.app/gtav_fast" \
          GTAV_IOS_SDK="$UPSTREAM/rexglue-sdk/out/install/ios-arm64" \
          GTAV_IOS_INTERFACE="$UPSTREAM/build/ios-shell/game_interface" \
            "$UPSTREAM/tools/ios/make_shell.sh" "$GITHUB_WORKSPACE/rage-ios-runtime"

          APP="rage-ios-runtime/GTAV.app"
          test -s "$APP/gtav"
          test -s "$APP/librexruntime.dylib"
          test -s "$APP/librexgpu-xenos.dylib"
          test -s "$APP/libMoltenVK.dylib"
          test -s "$APP/Info.plist"
          test -s rage-ios-runtime/interface/gtav_hooks.h
          test -s rage-ios-runtime/interface/gtav_game.exports
          test -s rage-ios-runtime/interface/gtav_game.undefs
          test -s rage-ios-runtime/libSystem_ios.tbd
          test -s rage-ios-runtime/LICENSES/MoltenVK.txt
          test -s rage-ios-runtime/LICENSES/simde.txt
          plutil -lint "$APP/Info.plist"

          {
            echo "=== Bundle files ==="
            find rage-ios-runtime -type f -maxdepth 5 -print | sort
            echo
            echo "=== Binary formats and architectures ==="
            for binary in "$APP/gtav" "$APP/librexruntime.dylib" "$APP/librexgpu-xenos.dylib" "$APP/libMoltenVK.dylib"; do
              file "$binary"
              archs="$(lipo -archs "$binary")"
              echo "$binary: $archs"
              case " $archs " in *" arm64 "*) ;; *) echo "ERROR: $binary is not arm64"; exit 1 ;; esac
            done
            echo
            echo "=== Executable dynamic dependencies ==="
            otool -L "$APP/gtav"
            echo
            echo "=== Runtime dynamic dependencies ==="
            otool -L "$APP/librexruntime.dylib"
            otool -L "$APP/librexgpu-xenos.dylib"
            echo
            echo "=== MoltenVK dynamic dependencies ==="
            otool -L "$APP/libMoltenVK.dylib"
          } | tee rage-ios-runtime/BINARY-AUDIT.txt

          otool -L "$APP/gtav" | grep -q 'gtav_game.dylib' || {
            echo "ERROR: shell executable does not reference the expected separately generated game library"
            exit 1
          }

          cat > rage-ios-runtime/BUILD-STATUS.txt <<'EOF'
          Upstream iOS GTAV.app shell assembled with upstream tools/ios/make_shell.sh.
          CPU compile target: ${{ matrix.cpu_target }}.
          apple-a13 is an experimental compatibility build, not an upstream-supported device guarantee.
          This is NOT a playable GTA V IPA and is intentionally unsigned.
          It includes the upstream iOS host shell, ReXGlue runtime libraries,
          MoltenVK, Info.plist, game-library interface metadata, iOS linker stubs,
          SIMDe headers, and third-party licenses.
          It contains no Rockstar game code, game data, generated game library,
          game shaders, provisioning profile, or app signing.
          A compatible device and locally supplied game data/build outputs are still required.
          EOF

      - name: Upload unsigned GTAV.app shell package (no game data)
        uses: actions/upload-artifact@v4
        with:
          name: rage-ios-gtav-app-shell-${{ matrix.cpu_target }}-no-game-data
          path: rage-ios-runtime/
          if-no-files-found: error
