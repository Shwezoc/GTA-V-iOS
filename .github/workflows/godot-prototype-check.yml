name: Godot Native 3D Prototype Check

on:
  push:
    branches: [godot-native-prototype]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-prototype-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import and parse project
        run: godot --headless --editor --path godot --quit
      - name: Run scene smoke test
        run: timeout 20s godot --headless --path godot --quit-after 5
