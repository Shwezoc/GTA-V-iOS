name: Browser Menu and Runtime Test Lab
on:
  push:
    branches: [minimal-runtime]
    paths:
      - 'browser/**'
      - '.github/workflows/browser-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate browser build
        run: |
          set -eu
          test -s browser/index.html
          test -s browser/style.css
          test -s browser/main.js
          test -s browser/menu.js
          test -s browser/menu.css
          test -s browser/gtav-loading.js
          test -s browser/assets/gtav-loading/README.md
          node --check browser/gtav-loading.js
          node --check browser/main.js
          node --check browser/menu.js
          test -s browser/bmw-viewer.html
          test -s browser/bmw-viewer.css
          test -s browser/bmw-viewer.js
          test -s browser/vendor/three.module.js
          test -s browser/vendor/examples/jsm/loaders/GLTFLoader.js
          test -s browser/vendor/examples/jsm/utils/BufferGeometryUtils.js
          test -s browser/assets/models/bmw-m5-f90/bmwm5f90_hi.glb
          node --check browser/bmw-viewer.js
          touch browser/.nojekyll
      - name: Upload browser build
        uses: actions/upload-pages-artifact@v3
        with:
          path: browser
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
