name: Browser Menu and Runtime Test Lab
on:
  push:
    branches: [minimal-runtime]
    paths:
      - 'browser/**'
      - '.github/workflows/browser-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate browser build and BMW RAGE model viewer
        run: |
          set -eu
          test -s browser/index.html
          test -s browser/style.css
          test -s browser/main.js
          test -s browser/menu.js
          test -s browser/menu.css
          test -s browser/gtav-loading.js
          test -s browser/bmw-viewer.html
          test -s browser/bmw-viewer.js
          test -s browser/bmw-viewer.css
          test -s browser/assets/gtav-loading/README.md
          test -s browser/assets/models/bmw-m5-f90/bmwm5f90_hi.glb
          test -s browser/assets/models/bmw-m5-f90/bmwm5f90_hi-preview.png
          test -s browser/vendor/three.module.js
          test -s browser/vendor/examples/jsm/loaders/GLTFLoader.js
          test -s browser/vendor/examples/jsm/utils/BufferGeometryUtils.js
          node --check browser/gtav-loading.js
          node --check browser/main.js
          node --check browser/menu.js
          node --input-type=module --check < browser/bmw-viewer.js
          touch browser/.nojekyll
          echo "Browser lab and offline BMW M5 F90 GLB viewer validated."

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Smoke-test real BMW GLB rendering in Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory browser >/tmp/bmw-viewer-http.log 2>&1 &
          echo $! >/tmp/bmw-viewer-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/bmw-viewer.html >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({
            headless: true,
            args: ["--enable-webgl", "--enable-unsafe-swiftshader", "--use-gl=angle", "--use-angle=swiftshader", "--ignore-gpu-blocklist"]
          });
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          const errors = [];
          page.on("pageerror", e => errors.push(e.message));
          page.on("console", m => { if (m.type() === "error") errors.push(m.text()); });
          await page.goto("http://127.0.0.1:4173/bmw-viewer.html", { waitUntil: "domcontentloaded" });
          await page.waitForFunction(
            () => document.querySelector("#load-state")?.textContent === "МОДЕЛЬ ЗАГРУЖЕНА",
            undefined,
            { timeout: 90000 }
          );
          await page.waitForTimeout(1200);
          const canvas = await page.locator("#viewport").evaluate(el => ({
            width: el.width,
            height: el.height,
            webgl2: !!el.getContext("webgl2")
          }));
          if (!canvas.width || !canvas.height || !canvas.webgl2) throw new Error("WebGL2 canvas did not initialize: " + JSON.stringify(canvas));
          await page.screenshot({ path: "bmw-viewer-smoke.png", fullPage: false });
          if (errors.length) throw new Error("Browser console errors: " + errors.join(" | "));
          console.log("BMW M5 F90 GLB loaded and rendered in Chromium: " + JSON.stringify(canvas));
          await browser.close();
          NODE
          kill "$(cat /tmp/bmw-viewer-http.pid)" || true

      - name: Publish browser build
        uses: actions/upload-pages-artifact@v3
        with:
          path: browser

      - name: Publish BMW viewer smoke-test screenshot
        uses: actions/upload-artifact@v4
        with:
          name: BMW-M5-F90-browser-smoke-test
          path: bmw-viewer-smoke.png
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
