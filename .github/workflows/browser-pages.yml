name: Browser Menu and Runtime Test Lab
on:
  push:
    branches: [minimal-runtime]
    paths:
      - 'browser/**'
      - '.github/workflows/browser-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Franklin GLB from validated rigging run
        uses: actions/download-artifact@v4
        with:
          name: franklin-niko-retargeted-animated-glb
          path: /tmp/franklin-asset
          repository: ${{ github.repository }}
          run-id: 46113312010
          github-token: ${{ github.token }}

      - name: Stage Franklin model for browser scene
        run: |
          set -eu
          mkdir -p browser/assets/models/franklin
          model="$(find /tmp/franklin-asset -type f -name '*.glb' -print -quit)"
          test -n "$model"
          cp "$model" browser/assets/models/franklin/franklin_niko_animated.glb
          test -s browser/assets/models/franklin/franklin_niko_animated.glb
          ls -lh browser/assets/models/franklin/franklin_niko_animated.glb

      - name: Validate browser build and BMW RAGE model viewer
        run: |
          set -eu
          test -s browser/index.html
          test -s browser/style.css
          test -s browser/main.js
          test -s browser/menu.js
          test -s browser/menu.css
          test -s browser/gtav-loading.js
          test -s browser/bmw-viewer.html
          test -s browser/bmw-viewer.js
          test -s browser/bmw-viewer.css
          test -s browser/drive-test.html
          test -s browser/drive-test.js
          test -s browser/drive-test.css
          test -s browser/assets/models/franklin/franklin_niko_animated.glb
          test -s browser/assets/gtav-loading/README.md
          test -s browser/assets/models/bmw-m5-f90/bmwm5f90_hi.glb
          test -s browser/assets/models/bmw-m5-f90/bmwm5f90_hi-preview.png
          test -s browser/vendor/three.module.js
          test -s browser/vendor/three.core.js
          test -s browser/vendor/examples/jsm/loaders/GLTFLoader.js
          test -s browser/vendor/examples/jsm/utils/BufferGeometryUtils.js
          node --check browser/gtav-loading.js
          node --check browser/main.js
          node --check browser/menu.js
          node --input-type=module --check < browser/bmw-viewer.js
          node --input-type=module --check < browser/drive-test.js
          touch browser/.nojekyll
          echo "Browser lab and offline BMW M5 F90 GLB viewer validated."

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Smoke-test real BMW GLB rendering in Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory browser >/tmp/bmw-viewer-http.log 2>&1 &
          echo $! >/tmp/bmw-viewer-http.pid
          trap 'kill "$(cat /tmp/bmw-viewer-http.pid)" 2>/dev/null || true; cat /tmp/bmw-viewer-http.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/bmw-viewer.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({
            headless: true,
            args: ["--enable-webgl", "--enable-unsafe-swiftshader", "--use-gl=angle", "--use-angle=swiftshader", "--ignore-gpu-blocklist"]
          });
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          const errors = [];
          const failedRequests = [];
          page.on("pageerror", e => errors.push(e.message));
          page.on("console", m => { if (m.type() === "error") errors.push(m.text()); });
          page.on("requestfailed", r => failedRequests.push(r.url() + ": " + (r.failure()?.errorText || "failed")));
          page.on("response", r => { if (r.status() >= 400) failedRequests.push(r.status() + " " + r.url()); });
          await page.goto("http://127.0.0.1:4173/bmw-viewer.html", { waitUntil: "domcontentloaded" });
          await page.waitForTimeout(12000);
          const diag = await page.evaluate(() => {
            const c = document.querySelector("#viewport");
            return {
              state: document.querySelector("#load-state")?.textContent,
              canvas: { width: c?.width, height: c?.height },
              webgl2: (() => { try { return !!c?.getContext("webgl2"); } catch { return false; } })(),
              moduleScript: document.querySelector('script[type="module"]')?.getAttribute("src")
            };
          });
          if (diag.state !== "МОДЕЛЬ ЗАГРУЖЕНА" || !diag.webgl2 || !diag.canvas.width || !diag.canvas.height) {
            throw new Error("BMW GLB viewer did not reach rendered state. Diagnostics: " + JSON.stringify({diag, errors, failedRequests}));
          }
          if (errors.length || failedRequests.length) {
            throw new Error("Browser errors: " + JSON.stringify({errors, failedRequests}));
          }
          await page.screenshot({ path: "bmw-viewer-smoke.png", fullPage: false });
          console.log("BMW M5 F90 GLB loaded and rendered in Chromium: " + JSON.stringify(diag));
          await page.close(); // release the high-detail BMW viewer before loading both assets together
          const driveErrors = [];
          const driveFailedRequests = [];
          const drivePage = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
          drivePage.on("pageerror", e => driveErrors.push(e.message));
          drivePage.on("console", m => { if (m.type() === "error") driveErrors.push(m.text()); });
          drivePage.on("requestfailed", r => driveFailedRequests.push(r.url() + ": " + (r.failure()?.errorText || "failed")));
          drivePage.on("response", r => { if (r.status() >= 400) driveFailedRequests.push(r.status() + " " + r.url()); });
          const driveResponse = await drivePage.goto("http://127.0.0.1:4173/drive-test.html", { waitUntil: "domcontentloaded" });
          await drivePage.waitForSelector("#load-state", { state: "attached", timeout: 15000 });
          await drivePage.waitForFunction(() => {
            const s = document.querySelector("#load-state")?.textContent || "";
            return s === "СЦЕНА ГОТОВА" || s === "ОШИБКА";
          }, null, { timeout: 90000 });
          const driveDiag = await drivePage.evaluate(() => ({
            title: document.title,
            state: document.querySelector("#load-state")?.textContent || "MISSING",
            error: document.querySelector("#error")?.textContent || "",
            objective: document.querySelector("#objective")?.textContent || "",
            canvas: { width: document.querySelector("#world")?.width, height: document.querySelector("#world")?.height },
            body: document.body.innerText.slice(0, 1200)
          }));
          if (driveResponse?.status() !== 200 || driveDiag.state !== "СЦЕНА ГОТОВА" || driveErrors.length || driveFailedRequests.length) {
            throw new Error("Franklin + BMW drive scene failed: " + JSON.stringify({http: driveResponse?.status(), driveDiag, driveErrors, driveFailedRequests}));
          }
          const enterControl = drivePage.locator("#enter");
          const initialControl = await enterControl.evaluate(el => ({display: getComputedStyle(el).display, disabled: el.disabled}));
          if (initialControl.display === "none") throw new Error("Mobile enter-car button is hidden on foot: " + JSON.stringify(initialControl));
          await drivePage.keyboard.down("a");
          await drivePage.waitForTimeout(650);
          await drivePage.keyboard.up("a");
          await drivePage.waitForFunction(() => document.querySelector("#enter")?.disabled === false, null, { timeout: 5000 });
          await enterControl.click();
          await drivePage.waitForFunction(() => document.body.classList.contains("in-car"), null, { timeout: 3000 });
          const inCarControls = await drivePage.evaluate(() => ({
            inCar: document.body.classList.contains("in-car"),
            pedals: getComputedStyle(document.querySelector(".pedals")).display,
            steer: getComputedStyle(document.querySelector(".steer")).display,
            enterText: document.querySelector("#enter").innerText
          }));
          if (!inCarControls.inCar || inCarControls.pedals === "none" || inCarControls.steer === "none") {
            throw new Error("Vehicle controls did not activate after entering BMW: " + JSON.stringify(inCarControls));
          }
          await drivePage.screenshot({ path: "franklin-bmw-drive-test.png", fullPage: false });
          console.log("Franklin + BMW loaded; mobile enter/drive controls verified: " + JSON.stringify({driveDiag,inCarControls}));
          await drivePage.close();
          await browser.close();
          NODE

      - name: Publish browser build
        uses: actions/upload-pages-artifact@v3
        with:
          path: browser

      - name: Publish BMW viewer smoke-test screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Franklin-BMW-drive-scene-smoke-test
          path: |
            bmw-viewer-smoke.png
            franklin-bmw-drive-test.png
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
