name: Decode Niko YCD animations

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Google Drive share link or SwissTransfer URL to the Niko Walk Style ZIP archive
        required: true
        type: string
  push:
    branches: [minimal-runtime]
    paths:
      - ".github/workflows/decode-niko-ycd.yml"
      - "tools/ycd-inspector/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pin and fetch CodeWalker parser
        shell: pwsh
        run: |
          git clone https://github.com/dexyfex/CodeWalker.git third_party/CodeWalker
          git -C third_party/CodeWalker checkout 485d56bec00262ed7fa472261cce7bbc6202b96e
      - name: Build YCD inspector
        run: dotnet build tools/ycd-inspector/YcdInspector.csproj --configuration Release

  decode:
    if: ${{ needs.build.result == 'success' }}
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pin and fetch CodeWalker parser
        shell: pwsh
        run: |
          git clone https://github.com/dexyfex/CodeWalker.git third_party/CodeWalker
          git -C third_party/CodeWalker checkout 485d56bec00262ed7fa472261cce7bbc6202b96e
      - name: Fetch pinned Freemode Male skeleton reference
        shell: pwsh
        run: |
          $uri = "https://raw.githubusercontent.com/B7Kompirine/muto-ped-rig/v0.3.2/data/template_mp_m.json"
          $target = "$env:RUNNER_TEMP/mp_m_skeleton.json"
          Invoke-WebRequest -Uri $uri -OutFile $target
          $skeleton = Get-Content $target -Raw | ConvertFrom-Json
          if ($skeleton.armature -ne "mp_m_freemode_01" -or $skeleton.bones.Count -lt 100) {
            throw "Pinned Freemode Male skeleton reference failed validation"
          }
          Write-Host "Skeleton reference: $($skeleton.armature), $($skeleton.bones.Count) bones"
      - name: Download and validate source archive
        shell: pwsh
        env:
          ARCHIVE_URL: ${{ inputs.archive_url || 'https://drive.google.com/file/d/14nYmjvl2zGaikXFzoKjH0SFTdeNxnn4z/view?usp=drivesdk' }}
        run: |
          $env:ARCHIVE_URL = $env:ARCHIVE_URL.Trim()
          if ([string]::IsNullOrWhiteSpace($env:ARCHIVE_URL)) { throw "workflow_dispatch requires archive_url" }
          if (-not $env:ARCHIVE_URL.StartsWith("https://")) { throw "Only HTTPS archive URLs are accepted" }
          $downloadDir = "$env:RUNNER_TEMP/niko-download"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $zipPath = Join-Path $downloadDir "niko-walk-style.zip"
          if ($env:ARCHIVE_URL -match 'drive\.google\.com') {
            $fileId = $null
            if ($env:ARCHIVE_URL -match '/file/d/([A-Za-z0-9_-]+)') { $fileId = $Matches[1] }
            elseif ($env:ARCHIVE_URL -match '[?&]id=([A-Za-z0-9_-]+)') { $fileId = $Matches[1] }
            if ([string]::IsNullOrWhiteSpace($fileId)) { throw "Could not extract Google Drive file ID from URL" }
            python -m pip install --disable-pip-version-check gdown==5.2.0
            python -m gdown $fileId -O $zipPath
            if ($LASTEXITCODE -ne 0) { throw "Google Drive download failed; check that link access is set to Anyone with the link" }
          } else {
            git clone --depth 1 https://github.com/tekru-labs/swish-dl.git "$env:RUNNER_TEMP/swish-dl"
            Push-Location "$env:RUNNER_TEMP/swish-dl"
            npm install --omit=dev
            node index.js $env:ARCHIVE_URL --output $downloadDir
            Pop-Location
          }
          $archives = @(Get-ChildItem $downloadDir -Recurse -File -Filter *.zip)
          if ($archives.Count -ne 1) { throw "Expected exactly one ZIP archive, found $($archives.Count)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archives[0].FullName)
          $entries = @($zip.Entries | Where-Object { $_.FullName -match '\.ycd$' })
          $zip.Dispose()
          if ($entries.Count -lt 1) { throw "No YCD files found in archive" }
          $entries | ForEach-Object { Write-Host "$($_.FullName) ($($_.Length) bytes)" }
          $nikoSrc = "$env:RUNNER_TEMP/niko-src"
          New-Item -ItemType Directory -Force -Path $nikoSrc | Out-Null
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $nikoSrc -Force
      - name: Decode all supplied YCD resources
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/ycd-output"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $files = Get-ChildItem "$env:RUNNER_TEMP/niko-src" -Recurse -File -Filter *.ycd
          foreach ($file in $files) {
            dotnet run --configuration Release --project tools/ycd-inspector/YcdInspector.csproj -- "$($file.FullName)" "$out" "$env:RUNNER_TEMP/mp_m_skeleton.json"
            if ($LASTEXITCODE -ne 0) { throw "YCD decode failed: $($file.Name)" }
          }
      - name: Export skeleton-labelled animation channel intermediate
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/ycd-output"
          $xmlFiles = Get-ChildItem $out -File -Filter *.ycd.xml
          foreach ($xml in $xmlFiles) {
            $base = [System.IO.Path]::GetFileNameWithoutExtension($xml.Name)
            $target = Join-Path $out ($base + ".nikoanim.json")
            python tools/ycd-inspector/export_niko_animation.py --xml $xml.FullName --skeleton "$env:RUNNER_TEMP/mp_m_skeleton.json" --out $target
            if ($LASTEXITCODE -ne 0) { throw "Animation intermediate export failed: $($xml.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: niko-ycd-decoded-xml-and-bone-track-report
          path: ycd-output/
          if-no-files-found: error
          retention-days: 30
