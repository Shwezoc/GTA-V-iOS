name: Package Franklin + BMW mobile slice as native GTA V DLC RPF7

on:
  push:
    branches: [minimal-runtime]
    paths:
      - ".github/workflows/package-bmw-dlc-rpf.yml"
      - "tools/ycd-inspector/Program.cs"
      - "tools/ycd-inspector/YcdInspector.csproj"
      - "tools/rpf7-inspect.py"
      - "tools/tests/test_rpf7_inspect.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download original BMW M5 F90 RAGE resources
        uses: actions/download-artifact@v4
        with:
          name: BMW-M5-F90-extracted-RAGE-assets
          run-id: 46094904611
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: work/bmw-source

      - name: Download Franklin native ped resources and retargeted animation
        uses: actions/download-artifact@v4
        with:
          name: franklin-niko-retargeted-animated-glb
          run-id: 46113312010
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: work/franklin-source

      - name: Test RPF7 index inspector
        shell: pwsh
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch pinned CodeWalker RPF writer and reader
        shell: pwsh
        run: |
          git clone https://github.com/dexyfex/CodeWalker.git third_party/CodeWalker
          git -C third_party/CodeWalker checkout 485d56bec00262ed7fa472261cce7bbc6202b96e
          dotnet build tools/ycd-inspector/YcdInspector.csproj --configuration Release

      - name: Build native Franklin + BMW mobile-slice DLC RPF7 and round-trip verify with CodeWalker
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path work/out | Out-Null
          $dll = "tools/ycd-inspector/bin/Release/net8.0/YcdInspector.dll"
          dotnet $dll --pack-mobile-slice-dlc work/bmw-source work/franklin-source work/out/dlc.rpf |
            Out-File -FilePath work/rpf-pack-report.json -Encoding utf8
          if (-not (Test-Path "work/out/dlc.rpf")) { throw "DLC RPF7 output is missing" }
          $stream = [System.IO.File]::OpenRead("work/out/dlc.rpf")
          try {
            $header = New-Object byte[] 4
            [void]$stream.Read($header, 0, 4)
            $version = [System.BitConverter]::ToUInt32($header, 0)
          } finally { $stream.Dispose() }
          if ($version -ne 0x52504637) { throw ("Output archive has an unexpected RPF version: 0x{0:X8}" -f $version) }
          $report = Get-Content "work/rpf-pack-report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "pass" -or -not $report.codeWalkerRoundTrip) {
            throw "CodeWalker RPF7 round-trip validation did not pass"
          }
          python tools/rpf7-inspect.py work/out/dlc.rpf --json | Out-File -FilePath work/rpf7-index-report.json -Encoding utf8
          $index = Get-Content "work/rpf7-index-report.json" -Raw | ConvertFrom-Json
          if ($index.status -ne "pass" -or $index.fileCount -lt 1) { throw "Independent RPF7 TOC inspection failed" }
          Write-Host "INDEPENDENT_RPF7_INDEX_VALID files=$($index.fileCount) resources=$($index.resourceCount) binary=$($index.binaryCount)"
          Write-Host "MOBILE_SLICE_RPF7_VALID bytes=$($report.bytes) resources=$($report.resourceCount) vehicleResources=$($report.vehicleResourceCount) modParts=$($report.vehicleModPartCount) franklinPedResources=$($report.franklinPedResourceCount)"
          $report | ConvertTo-Json -Depth 8 | Write-Host
          Remove-Item "work/out/dlc.rpf" -Force

      - name: Upload metadata-only RPF7 validation report
        uses: actions/upload-artifact@v4
        with:
          name: franklin-bmw-mobile-slice-rpf7-validation-report
          path: work/rpf-pack-report.json
          if-no-files-found: error
          retention-days: 30
