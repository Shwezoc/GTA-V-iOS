name: Inspect GTAV model archive from SwissTransfer

on:
  workflow_dispatch:
    inputs:
      transfer_url:
        description: "SwissTransfer download URL (/dl/<id> or /d/<id>)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Open SwissTransfer and download the archive in Chromium
        env:
          TRANSFER_URL: ${{ inputs.transfer_url }}
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          cat > download-transfer.cjs <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const url = process.env.TRANSFER_URL;
          const parsed = new URL(url);
          if (parsed.protocol !== "https:" || parsed.hostname !== "www.swisstransfer.com" ||
              !/^\/(?:dl|d)\/[0-9a-f-]{36}\/?$/i.test(parsed.pathname)) {
            throw new Error("Only a valid SwissTransfer /dl/<UUID> or /d/<UUID> URL is accepted");
          }
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({acceptDownloads:true});
            const page = await context.newPage();
            page.on("console", msg => console.log("BROWSER",msg.type(),msg.text()));
            page.on("pageerror", err => console.log("PAGE_ERROR",err.message));
            const response = await page.goto(url,{waitUntil:"domcontentloaded",timeout:60000});
            console.log("TRANSFER_PAGE",JSON.stringify({status:response?.status(),title:await page.title()}));
            await page.getByText(/Download all/i).first().waitFor({state:"visible",timeout:30000});
            const downloadPromise = page.waitForEvent("download",{timeout:120000});
            await page.getByText(/Download all/i).first().click();
            const download = await downloadPromise;
            const filename = download.suggestedFilename();
            console.log("DOWNLOAD_STARTED",filename);
            await download.saveAs("model.rar");
            const failure = await download.failure();
            if (failure) throw new Error("Browser download failed: "+failure);
            const stat=fs.statSync("model.rar");
            console.log("DOWNLOAD_SAVED",JSON.stringify({filename,bytes:stat.size}));
            if (stat.size < 1000000) throw new Error("Downloaded file is unexpectedly small");
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node download-transfer.cjs

      - name: Validate RAR and publish archive inventory
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          7z t model.rar
          7z l -slt model.rar > archive-list.txt
          {
            echo "## SwissTransfer archive inspection"
            echo ""
            echo "- Downloaded bytes: $(stat -c%s model.rar)"
            echo "- SHA-256: $(sha256sum model.rar | cut -d' ' -f1)"
            echo ""
            echo "### Archive entries"
            echo '```text'
            sed -n '1,240p' archive-list.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
