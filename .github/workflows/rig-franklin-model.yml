name: Rig Franklin model to GTA freemode skeleton

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: HTTPS download link to Franklin OBJ ZIP (Google Drive share link accepted)
        required: true
        default: "https://drive.google.com/file/d/1qEngzGlQTGAGIYFcJMG4dCJ-F54Gg_Gr/view?usp=drivesdk"
        type: string
      niko_archive_url:
        description: Google Drive share link to the Niko Walk Style ZIP archive
        required: true
        default: "https://drive.google.com/file/d/14nYmjvl2zGaikXFzoKjH0SFTdeNxnn4z/view?usp=drivesdk"
        type: string
      model_height:
        description: Target character height in metres
        required: true
        default: "1.83"
        type: string
  push:
    branches: [minimal-runtime]
    paths:
      - ".github/workflows/rig-franklin-model.yml"
      - "tools/retarget_niko_animations.py"

permissions:
  contents: read
  actions: read

jobs:
  rig-franklin:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python for archive download
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .NET for CodeWalker YCD parser
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch and build pinned CodeWalker YCD parser
        shell: pwsh
        run: |
          git clone https://github.com/dexyfex/CodeWalker.git third_party/CodeWalker
          git -C third_party/CodeWalker checkout 485d56bec00262ed7fa472261cce7bbc6202b96e
          dotnet build tools/ycd-inspector/YcdInspector.csproj --configuration Release

      - name: Download and safely unpack Franklin OBJ package
        env:
          ARCHIVE_URL: ${{ inputs.archive_url || 'https://drive.google.com/file/d/1qEngzGlQTGAGIYFcJMG4dCJ-F54Gg_Gr/view?usp=drivesdk' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ARCHIVE_URL" in
            https://*) ;;
            *) echo "Only HTTPS archive URLs are accepted"; exit 2 ;;
          esac
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p work/input work/unpacked work/output
          mkdir -p "$TEMP_DIR/franklin-transfer"
          if [[ "$ARCHIVE_URL" == *"drive.google.com"* ]]; then
            python -m pip install --user --disable-pip-version-check gdown
            FILE_ID="$(python -c 'import re,sys; u=sys.argv[1]; m=re.search(r"/file/d/([A-Za-z0-9_-]+)", u) or re.search(r"[?&]id=([A-Za-z0-9_-]+)", u); print(m.group(1) if m else u)' "$ARCHIVE_URL")"
            python -m gdown "$FILE_ID" -O "$TEMP_DIR/franklin-transfer/franklin-package.zip"
          else
            curl --fail --location --retry 3 --retry-all-errors \
              --user-agent "Mozilla/5.0" \
              "$ARCHIVE_URL" -o "$TEMP_DIR/franklin-transfer/franklin-package.zip"
          fi
          python - <<'PY'
          import pathlib, zipfile, os
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "franklin-transfer" / "franklin-package.zip"
          if not archive.is_file() or archive.stat().st_size < 1000:
              raise SystemExit("Download did not produce a valid-sized ZIP file")
          if not zipfile.is_zipfile(archive):
              head = archive.read_bytes()[:200].decode("utf-8", "replace")
              raise SystemExit("Downloaded response is not a ZIP archive; check direct-download permissions. Response starts with: " + repr(head))
          print("FRANKLIN_ARCHIVE_DOWNLOADED", archive.stat().st_size, "bytes")
          PY
          cp "$TEMP_DIR/franklin-transfer/franklin-package.zip" work/unpacked/franklin-package.zip
          python - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path("work/unpacked/franklin-package.zip")
          root = pathlib.Path("work/unpacked").resolve()
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
              z.extractall(root)
          objs = list(root.rglob("*.obj"))
          if len(objs) != 1:
              raise SystemExit(f"Expected exactly one OBJ, found {len(objs)}")
          obj = objs[0]
          mtl_files = list(obj.parent.glob("*.mtl"))
          if not mtl_files:
              raise SystemExit("OBJ package is missing its MTL material file")
          textures = [p for p in obj.parent.rglob("*") if p.is_file() and p.suffix.lower() in {".png", ".jpg", ".jpeg", ".tga", ".dds"}]
          if not textures:
              raise SystemExit("OBJ package contains no texture images")
          import shutil
          shutil.copy2(obj, pathlib.Path("work/input/franklin.obj"))
          shutil.copy2(mtl_files[0], pathlib.Path("work/input") / mtl_files[0].name)
          for p in textures:
              dest = pathlib.Path("work/input") / p.name
              if not dest.exists():
                  shutil.copy2(p, dest)
          print(f"FRANKLIN_PACKAGE_OK obj={obj.name} mtl={mtl_files[0].name} textures={len(textures)}")
          PY
          test -s work/input/franklin.obj
          find work/input -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Decode Niko walk-style YCD for retargeting
        env:
          NIKO_ARCHIVE_URL: ${{ inputs.niko_archive_url || 'https://drive.google.com/file/d/14nYmjvl2zGaikXFzoKjH0SFTdeNxnn4z/view?usp=drivesdk' }}
        shell: pwsh
        run: |
          $url = $env:NIKO_ARCHIVE_URL.Trim()
          if (-not $url.StartsWith("https://")) { throw "Niko archive URL must use HTTPS" }
          python -m pip install --disable-pip-version-check gdown==5.2.0
          if ($url -match 'drive\.google\.com') {
            $fileId = $null
            if ($url -match '/file/d/([A-Za-z0-9_-]+)') { $fileId = $Matches[1] }
            elseif ($url -match '[?&]id=([A-Za-z0-9_-]+)') { $fileId = $Matches[1] }
            if ([string]::IsNullOrWhiteSpace($fileId)) { throw "Could not extract Niko Google Drive file ID" }
            python -m gdown $fileId -O "$env:RUNNER_TEMP/niko-walk-style.zip"
          } else {
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/niko-walk-style.zip"
          }
          if ($LASTEXITCODE -ne 0) { throw "Niko archive download failed" }
          $nikoRoot = "$env:RUNNER_TEMP/niko-walk-style"
          New-Item -ItemType Directory -Force -Path $nikoRoot | Out-Null
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/niko-walk-style.zip" -DestinationPath $nikoRoot -Force
          $ycd = Get-ChildItem $nikoRoot -Recurse -File -Filter "move_m@wfire@nikowalk.ycd" | Select-Object -First 1
          if (-not $ycd) { throw "Niko walk-style YCD resource was not found in the archive" }
          $skeleton = "$env:RUNNER_TEMP/mp_m_skeleton.json"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/B7Kompirine/muto-ped-rig/v0.3.2/data/template_mp_m.json" -OutFile $skeleton
          $decoded = "$env:GITHUB_WORKSPACE/work/niko-decoded"
          New-Item -ItemType Directory -Force -Path $decoded | Out-Null
          dotnet run --configuration Release --project tools/ycd-inspector/YcdInspector.csproj -- "$($ycd.FullName)" $decoded $skeleton
          if ($LASTEXITCODE -ne 0) { throw "Niko YCD decode failed" }
          "NIKO_YCD_XML=$decoded/move_m@wfire@nikowalk.ycd.xml" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MP_M_SKELETON=$skeleton" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Blender 5.2.0
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          GITHUB_PATH_FILE="$(cygpath -u "$GITHUB_PATH")"
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.0-windows-x64.zip \
            -o "$TEMP_DIR/blender.zip"
          unzip -q "$TEMP_DIR/blender.zip" -d "$TEMP_DIR"
          BLENDER_DIR="$(find "$TEMP_DIR" -maxdepth 1 -type d -name 'blender-*windows-x64' | head -n1)"
          test -n "$BLENDER_DIR"
          mv "$BLENDER_DIR" "$TEMP_DIR/blender"
          echo "$RUNNER_TEMP\\blender" >> "$GITHUB_PATH_FILE"
          "$TEMP_DIR/blender/blender.exe" --background --version

      - name: Install pinned Muto Ped Rig and Sollumz
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          ADDONS="$TEMP_DIR/blender/5.2/scripts/addons"
          mkdir -p "$ADDONS"
          git clone --depth 1 --branch v0.3.2 https://github.com/B7Kompirine/muto-ped-rig.git "$ADDONS/muto_ped_rig"
          git clone --depth 1 --branch v2.9.0 https://github.com/Sollumz/Sollumz.git "$ADDONS/Sollumz"
          test -f "$ADDONS/muto_ped_rig/bl/batch_worker.py"
          test -f "$ADDONS/Sollumz/__init__.py"
          git clone --depth 1 --branch v4.2.0 https://github.com/KhronosGroup/glTF-Blender-IO.git "$TEMP_DIR/gltf-blender-io"
          cp -R "$TEMP_DIR/gltf-blender-io/addons/io_scene_gltf2" "$ADDONS/io_scene_gltf2"
          test -f "$ADDONS/io_scene_gltf2/__init__.py"

      - name: Enable add-ons and rig Franklin
        env:
          MODEL_HEIGHT: ${{ inputs.model_height }}
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          ADDONS="$TEMP_DIR/blender/5.2/scripts/addons"
          ADDONS_WIN="$(cygpath -m "$ADDONS")"
          WORKSPACE_WIN="$(cygpath -m "$WORKSPACE")"
          TEMP_WIN="$(cygpath -m "$TEMP_DIR")"
          export CI=true
          export PYTHONPATH="$ADDONS${PYTHONPATH:+:$PYTHONPATH}"
          "$TEMP_DIR/blender/blender.exe" --background \
            --python-expr "import sys,bpy; sys.path.insert(0, '$ADDONS_WIN'); bpy.utils.refresh_script_paths(); import Sollumz; bpy.ops.preferences.addon_enable(module='Sollumz'); bpy.ops.preferences.addon_enable(module='muto_ped_rig'); bpy.ops.wm.save_userpref(); print('ADDONS_ENABLED', 'Sollumz', 'muto_ped_rig')" \
            --python "$WORKSPACE_WIN/tools/rig_franklin.py" -- \
            "src=$WORKSPACE_WIN/work/input/franklin.obj" \
            "out=$WORKSPACE_WIN/work/output" \
            "worker=$TEMP_WIN/blender/5.2/scripts/addons/muto_ped_rig/bl/batch_worker.py" \
            "ped=franklin" \
            "height=$MODEL_HEIGHT"

      - name: Retarget Niko animations onto Franklin and export animated GLB
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          ADDONS="$TEMP_DIR/blender/5.2/scripts/addons"
          ADDONS_WIN="$(cygpath -m "$ADDONS")"
          WORKSPACE_WIN="$(cygpath -m "$WORKSPACE")"
          TEMP_WIN="$(cygpath -m "$TEMP_DIR")"
          export CI=true
          python -m py_compile "$WORKSPACE/tools/retarget_niko_animations.py"
          export PYTHONPATH="$ADDONS${PYTHONPATH:+:$PYTHONPATH}"
          "$TEMP_DIR/blender/blender.exe" --background --python-exit-code 1 \
            --python-expr "import sys,bpy; sys.path.insert(0, '$ADDONS_WIN'); bpy.utils.refresh_script_paths(); import Sollumz; bpy.ops.preferences.addon_enable(module='Sollumz'); import io_scene_gltf2; bpy.ops.preferences.addon_enable(module='io_scene_gltf2')" \
            --python "$WORKSPACE_WIN/tools/retarget_niko_animations.py" -- \
            "blend=$WORKSPACE_WIN/work/output/franklin.blend" \
            "xml=$WORKSPACE_WIN/work/niko-decoded/move_m@wfire@nikowalk.ycd.xml" \
            "skeleton=$TEMP_WIN/mp_m_skeleton.json" \
            "out=$WORKSPACE_WIN/work/output/niko-animated"
          test -s work/output/niko-animated/franklin_niko_animated.glb
          test -s work/output/niko-animated/franklin_niko_animated.blend
          test -s work/output/niko-animated/franklin_niko_retarget_report.json
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("work/output/niko-animated/franklin_niko_retarget_report.json").read_text())
          if not report.get("ok"):
              raise SystemExit("Retarget report did not mark the export successful")
          glb = report.get("glb", {})
          if glb.get("skinCount", 0) < 1 or glb.get("animationCount", 0) < 1:
              raise SystemExit(f"GLB validation failed: {glb}")
          if report.get("unmatchedBoneIds"):
              raise SystemExit(f"Unmatched animation bone IDs: {report['unmatchedBoneIds']}")
          print("FRANKLIN_NIKO_ANIMATED_GLB_VALID", json.dumps(glb))
          PY

      - name: Upload rigged GTA resource and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franklin-niko-retargeted-animated-glb
          path: work/output/
          if-no-files-found: warn
          retention-days: 30
