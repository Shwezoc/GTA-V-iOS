name: Rig Franklin model to GTA freemode skeleton

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: HTTPS download link to ZIP (Dropbox direct link or Google Drive share link)
        required: true
        type: string
      model_height:
        description: Target character height in metres
        required: true
        default: "1.83"
        type: string

permissions:
  contents: read

jobs:
  rig-franklin:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python for archive download
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download and safely unpack Franklin OBJ package
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ARCHIVE_URL" in
            https://*) ;;
            *) echo "Only HTTPS archive URLs are accepted"; exit 2 ;;
          esac
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p work/input work/unpacked work/output
          mkdir -p "$TEMP_DIR/franklin-transfer"
          if [[ "$ARCHIVE_URL" == *"drive.google.com"* ]]; then
            python -m pip install --user --disable-pip-version-check gdown
            FILE_ID="$(python -c 'import re,sys; u=sys.argv[1]; m=re.search(r"/file/d/([A-Za-z0-9_-]+)", u) or re.search(r"[?&]id=([A-Za-z0-9_-]+)", u); print(m.group(1) if m else u)' "$ARCHIVE_URL")"
            python -m gdown "$FILE_ID" -O "$TEMP_DIR/franklin-transfer/franklin-package.zip"
          else
            curl --fail --location --retry 3 --retry-all-errors \
              --user-agent "Mozilla/5.0" \
              "$ARCHIVE_URL" -o "$TEMP_DIR/franklin-transfer/franklin-package.zip"
          fi
          python - <<'PY'
          import pathlib, zipfile, os
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "franklin-transfer" / "franklin-package.zip"
          if not archive.is_file() or archive.stat().st_size < 1000:
              raise SystemExit("Download did not produce a valid-sized ZIP file")
          if not zipfile.is_zipfile(archive):
              head = archive.read_bytes()[:200].decode("utf-8", "replace")
              raise SystemExit("Downloaded response is not a ZIP archive; check direct-download permissions. Response starts with: " + repr(head))
          print("FRANKLIN_ARCHIVE_DOWNLOADED", archive.stat().st_size, "bytes")
          PY
          cp "$TEMP_DIR/franklin-transfer/franklin-package.zip" work/unpacked/franklin-package.zip
          python - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path("work/unpacked/franklin-package.zip")
          root = pathlib.Path("work/unpacked").resolve()
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
              z.extractall(root)
          objs = list(root.rglob("*.obj"))
          if len(objs) != 1:
              raise SystemExit(f"Expected exactly one OBJ, found {len(objs)}")
          obj = objs[0]
          mtl_files = list(obj.parent.glob("*.mtl"))
          if not mtl_files:
              raise SystemExit("OBJ package is missing its MTL material file")
          textures = [p for p in obj.parent.rglob("*") if p.is_file() and p.suffix.lower() in {".png", ".jpg", ".jpeg", ".tga", ".dds"}]
          if not textures:
              raise SystemExit("OBJ package contains no texture images")
          import shutil
          shutil.copy2(obj, pathlib.Path("work/input/franklin.obj"))
          shutil.copy2(mtl_files[0], pathlib.Path("work/input") / mtl_files[0].name)
          for p in textures:
              dest = pathlib.Path("work/input") / p.name
              if not dest.exists():
                  shutil.copy2(p, dest)
          print(f"FRANKLIN_PACKAGE_OK obj={obj.name} mtl={mtl_files[0].name} textures={len(textures)}")
          PY
          test -s work/input/franklin.obj
          find work/input -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Install Blender 5.2.0
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          GITHUB_PATH_FILE="$(cygpath -u "$GITHUB_PATH")"
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.0-windows-x64.zip \
            -o "$TEMP_DIR/blender.zip"
          unzip -q "$TEMP_DIR/blender.zip" -d "$TEMP_DIR"
          BLENDER_DIR="$(find "$TEMP_DIR" -maxdepth 1 -type d -name 'blender-*windows-x64' | head -n1)"
          test -n "$BLENDER_DIR"
          mv "$BLENDER_DIR" "$TEMP_DIR/blender"
          echo "$RUNNER_TEMP\\blender" >> "$GITHUB_PATH_FILE"
          "$TEMP_DIR/blender/blender.exe" --background --version

      - name: Install pinned Muto Ped Rig and Sollumz
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          ADDONS="$TEMP_DIR/blender/5.2/scripts/addons"
          mkdir -p "$ADDONS"
          git clone --depth 1 --branch v0.3.2 https://github.com/B7Kompirine/muto-ped-rig.git "$ADDONS/muto_ped_rig"
          git clone --depth 1 --branch v2.9.0 https://github.com/Sollumz/Sollumz.git "$ADDONS/Sollumz"
          test -f "$ADDONS/muto_ped_rig/bl/batch_worker.py"
          test -f "$ADDONS/Sollumz/__init__.py"

      - name: Enable add-ons and rig Franklin
        env:
          MODEL_HEIGHT: ${{ inputs.model_height }}
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          ADDONS="$TEMP_DIR/blender/5.2/scripts/addons"
          ADDONS_WIN="$(cygpath -m "$ADDONS")"
          WORKSPACE_WIN="$(cygpath -m "$WORKSPACE")"
          TEMP_WIN="$(cygpath -m "$TEMP_DIR")"
          export CI=true
          export PYTHONPATH="$ADDONS${PYTHONPATH:+:$PYTHONPATH}"
          "$TEMP_DIR/blender/blender.exe" --background \
            --python-expr "import sys,bpy; sys.path.insert(0, '$ADDONS_WIN'); bpy.utils.refresh_script_paths(); import Sollumz; bpy.ops.preferences.addon_enable(module='Sollumz'); bpy.ops.preferences.addon_enable(module='muto_ped_rig'); bpy.ops.wm.save_userpref(); print('ADDONS_ENABLED', 'Sollumz', 'muto_ped_rig')" \
            --python "$WORKSPACE_WIN/tools/rig_franklin.py" -- \
            "src=$WORKSPACE_WIN/work/input/franklin.obj" \
            "out=$WORKSPACE_WIN/work/output" \
            "worker=$TEMP_WIN/blender/5.2/scripts/addons/muto_ped_rig/bl/batch_worker.py" \
            "ped=franklin" \
            "height=$MODEL_HEIGHT"

      - name: Upload rigged GTA resource and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franklin-freemode-male-gta-resource
          path: work/output/
          if-no-files-found: warn
          retention-days: 30
