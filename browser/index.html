<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080d13">
  <title>Shwezov GTA V — Browser 3D Test</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
  </script>
</head>
<body>
  <div id="game"></div>
  <header class="hud">
    <div class="brand">SHWEZOV <span>3D PORT LAB</span></div>
    <div class="status">BROWSER BUILD · THREE.JS</div>
    <div class="hint">ПЕРСОНАЖ — ПРОЦЕДУРНЫЙ ПРОТОТИП, НЕ GTA V</div>
  </header>
  <div class="crosshair" aria-hidden="true"></div>
  <div class="controls">
    <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
    <div class="actions">
      <button id="run" class="action">RUN</button>
      <button id="reset" class="action secondary">RESET</button>
    </div>
  </div>
  <div id="loading" class="loading">ЗАГРУЗКА 3D-СЦЕНЫ…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
