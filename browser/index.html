<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d13">
<title>Shwezov — Lightweight 3D Prototype</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="game"></div>
<header class="hud">
<div class="brand">SHWEZOV <span>3D PORT LAB</span></div>
<div class="status">LIGHTWEIGHT BROWSER BUILD · NO CDN</div>
<div class="hint">BROWSER LAB · НЕ ИГРОВОЙ RAGE RUNTIME</div>
<section class="runtime-panel"><div class="panel-head"><span>RAGE / IOS BUILD</span><b id="rage-state" class="state pending">ПРОВЕРКА…</b></div><div id="rage-detail">Получаем статус сборки GitHub Actions</div><a id="rage-link" href="https://github.com/Shwezoc/GTA-V-iOS/actions" target="_blank" rel="noopener">ОТКРЫТЬ ЛОГ СБОРКИ ↗</a><div class="panel-foot">3D-СЦЕНА — ЛОКАЛЬНЫЙ ПРОЦЕДУРНЫЙ МАКЕТ</div></section>
</header>
<div class="crosshair" aria-hidden="true"></div>
<div class="controls">
<div id="stick" class="stick"><div id="knob" class="knob"></div></div>
<div class="actions"><button id="run" class="action">RUN</button><button id="reset" class="action secondary">RESET</button></div>
</div>
<div id="loading" class="loading">ЗАПУСК СЦЕНЫ…</div>
<script src="./main.js"></script>
</body>
</html>
